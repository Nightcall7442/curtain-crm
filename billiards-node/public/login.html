<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Бильярдный клуб</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .login-card h1 { margin: 0; font-size: 1.4rem; text-align: center; letter-spacing: -0.02em; }
    .login-card .sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin: -6px 0 8px; }
    .login-error { color: var(--red); font-size: 0.88rem; font-weight: 600; text-align: center; min-height: 1.2em; margin: 0; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>🎱 Бильярдный клуб</h1>
      <p class="sub">Вход для сотрудников</p>
      <label class="field">Логин
        <input id="login" type="text" autocomplete="username" required autofocus>
      </label>
      <label class="field">Пароль
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="primary">Войти</button>
    </form>
  </div>
  <script>
    "use strict";
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("login-error");
      errorBox.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login: document.getElementById("login").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          errorBox.textContent = body.detail ?? "Не удалось войти";
          return;
        }
        window.location.href = "/";
      } catch (err) {
        errorBox.textContent = "Сервер недоступен";
      }
    });
  </script>
</body>
</html>
