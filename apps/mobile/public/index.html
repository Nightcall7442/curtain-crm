<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!--
      Шаблон страницы приложения в браузере.

      Expo берёт `public/index.html` вместо своего шаблона, подставляет язык,
      заголовок и тег бандла. Всё, что делает из страницы устанавливаемое
      приложение — манифест, иконки, service worker, — живёт здесь: в коде
      приложения этому места нет, оно одинаково на телефоне и в браузере.
    -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" href="/app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />

    <!-- iPhone: без этого приложение с домашнего экрана открывается в Safari с адресной строкой. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Design House" />

    <style id="expo-reset">
      /* Рекомендованный сброс react-native-web: высота на весь экран и без прокрутки body. */
      html,
      body {
        height: 100%;
        /* Страница не тянется и не обновляется жестом — как приложение, а не сайт. */
        overscroll-behavior: none;
      }
      html {
        /*
          Поля вокруг «телефона» на широком экране — та же хвоя, что у
          шапки, только темнее: прежний бирюзовый #0e2f2b остался от старой
          палитры и спорил с колонкой приложения.
        */
        background-color: #0c1c16;
      }
      body {
        overflow: hidden;
        margin: 0 auto;
        /*
          Цвет фона приложения: пока грузится бандл, страница не мигает белым.
          Хвоя шапки (#142E24), а не прежний бирюзовый: тот же цвет стоит в
          `theme-color` (app.json → web.themeColor) и в манифесте, и строка
          состояния, заставка и первый кадр сливаются с шапкой в одно целое.
        */
        background-color: #142e24;
        /*
          Приложение — телефонного размера и на компьютере, и на планшете:
          экраны свёрстаны под телефон, растянутые на 1440 px они выглядят
          сайтом. Колонка в ширину большого телефона, по центру.
        */
        max-width: 480px;
        /*
          transform делает body «рамкой» для position: fixed — модальные окна
          и нижние шторки react-native-web открываются внутри колонки, а не
          на весь монитор.
        */
        transform: translateZ(0);
        -webkit-text-size-adjust: 100%;
        /* Как в приложении: текст интерфейса не выделяется долгим нажатием. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      @media (min-width: 481px) {
        body {
          box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.06),
            0 24px 80px rgba(0, 0, 0, 0.45);
        }
      }
      input,
      textarea,
      [contenteditable='true'] {
        -webkit-user-select: text;
        user-select: text;
      }
      /*
        Без браузерного кольца фокуса на полях ввода: оранжевая рамка поверх
        скруглённой рисовалась на каждое касание поля — на телефоне такого
        нет. Фокус показывает само поле — рамкой цвета акцента (`Field.tsx`).
        Поэтому КАЖДОЕ поле ввода в приложении обязано рисовать свой фокус,
        и не только `Field`: поле без него в браузере остаётся совсем без
        признака фокуса, и с клавиатуры не видно, куда пойдёт ввод.
        Кнопкам кольцо оставлено: оно нужно тем, кто ходит по форме с
        клавиатуры, и на касание браузер его не показывает.
      */
      input:focus,
      textarea:focus {
        outline: none;
      }
      * {
        /* Без синей вспышки при нажатии — у кнопок своё нажатое состояние. */
        -webkit-tap-highlight-color: transparent;
        /* Полос прокрутки в приложении нет; листается как обычно. */
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы приложения нужен JavaScript.</noscript>
    <div id="root"></div>

    <script>
      /*
        Долгое нажатие — жест приложения (на «Профиле» он открывает список
        входов), а не повод показать меню браузера «Открыть в новой вкладке /
        Скопировать ссылку / Скачать картинку». В полях ввода меню остаётся:
        там через него вставляют текст.
      */
      document.addEventListener('contextmenu', function (event) {
        var target = event.target;
        if (target instanceof Element && target.closest('input, textarea, [contenteditable="true"]')) return;
        event.preventDefault();
      });

      /*
        Service worker делает страницу приложением: браузер предлагает
        «установить», а открытое приложение переживает пропажу сети.
        Регистрация после `load` — чтобы не отнимать канал у бандла.
      */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/app/sw.js').catch(function () {
            // Не установился — приложение работает как обычная вкладка.
          });
        });
      }
    </script>
  </body>
</html>
